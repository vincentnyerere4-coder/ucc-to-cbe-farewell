`<!DOCTYPE html>` mpaka `</html>`:
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwaheri UCC DSM - By Boss Vin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0a8a4b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:white;width:100%;max-width:420px;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
h1{color:#065a30;font-size:26px;margin-bottom:8px}
.sub{color:#444;font-size:14px;margin-bottom:18px;line-height:1.5}
input{width:100%;padding:13px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;margin-bottom:12px;outline:none}
input:focus{border-color:#0a8a4b}
button{width:100%;background:#0a8a4b;color:white;border:none;padding:13px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
#msg{margin-top:14px;display:none;padding:12px;border-radius:10px;background:#dcfce7;color:#166534;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>🎓 Kwaheri UCC DSM</h1>
<p class="sub"><b>Familia yangu ya UCC DSM,</b><br>Tumesoma pamoja. Sasa Mungu amenipa hatua mpya - Degree IT CBE Dar. Asanteni sana. UCC mtakua moyoni mwangu daima.</p>
<hr style="margin:15px 0">
<h3>Weka Contact Yako Tusipotezane</h3><br>
<form id="f">
<input type="text" id="jina" placeholder="Jina lako kamili" required>
<input type="tel" id="simu" placeholder="Namba yako 07..." required>
<button type="submit" id="btn">Tuma</button>
</form>
<div id="msg"></div>
<p style="margin-top:18px;font-size:11px;color:gray">Prepared by Boss Vin | UCC DSM → CBE Dar</p>
</div>
<script>
const form=document.getElementById('f');
const EMAIL="vincentnyerere4@gmail.com";
const WA="255693641536";
form.addEventListener('submit',async(e)=>{
e.preventDefault();
const jina=document.getElementById('jina').value.trim();
const simu=document.getElementById('simu').value.trim();
document.getElementById('btn').innerText='Inatuma...';
try{
await fetch(`https://formsubmit.co/ajax/${EMAIL}`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({Jina:jina,Namba:simu,Ujumbe:`Mtu mpya: ${jina} - ${simu} kajiunga UCC Farewell`})});
}catch(e){console.log(e)}
const txt=`Habari Boss Vin! 🙏 Mimi ni ${jina} namba yangu ${simu} nimejisajili kwenye Farewell System ya UCC DSM. Tusipotezane!`;
setTimeout(()=>{
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(txt)}`,'_blank');
const m=document.getElementById('msg');
m.style.display='block';
m.innerHTML=`Asante ${jina}! ✅ Umesajiliwa.<br>Email na WhatsApp zimetumwa kwangu.`;
document.getElementById('btn').innerText='Tuma';
form.reset();
},1000);
});
</script>
</body>
</html>
